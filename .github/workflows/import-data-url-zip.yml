name: Import ZIP from data URL

on:
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  import-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Place the uploaded data URL text in the repository root as save.txt.
      - name: Decode data URL and extract ZIP
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import pathlib
          import zipfile

          source = pathlib.Path("save.txt")
          if not source.is_file():
              raise SystemExit("save.txt not found. Put the data:application/zip;base64,... URL in the repository root.")

          data_url = source.read_text(encoding="utf-8").strip()
          prefix = "data:application/zip;base64,"
          if not data_url.startswith(prefix):
              raise SystemExit("save.txt does not start with data:application/zip;base64,")

          archive_bytes = base64.b64decode(data_url[len(prefix):], validate=True)
          destination = pathlib.Path(".")

          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              # Prevent ZIP path traversal outside the repository.
              root = destination.resolve()
              for member in archive.infolist():
                  target = (destination / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {member.filename}")
              archive.extractall(destination)

          print("ZIP extracted successfully.")
          PY

      - name: Commit and push imported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import files from data URL ZIP"
          git push
